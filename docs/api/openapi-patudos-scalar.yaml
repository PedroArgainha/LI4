openapi: 3.0.3
info:
  title: Patudos & Companhia API
  version: 1.0.0
  description: Documentação OpenAPI da API REST do backend do sistema Patudos & Companhia, preparada para visualização no
    Scalar. A API suporta autenticação JWT, gestão de utilizadores, animais, reservas, serviços, pagamentos e relatórios operacionais.
  contact:
    name: Equipa LI4 - Patudos & Companhia
servers:
- url: http://localhost:8080
  description: Servidor local Spring Boot
tags:
- name: Autenticação
  description: Registo e início de sessão.
- name: Utilizadores
  description: Gestão de perfis e contas de utilizador.
- name: Animais
  description: Gestão das fichas dos animais.
- name: Reservas
  description: Criação, consulta e alteração do estado das reservas.
- name: Serviços
  description: Catálogo de serviços e associação de serviços às reservas.
- name: Pagamentos
  description: Registo, consulta e faturação simulada de pagamentos.
- name: Relatórios
  description: Relatórios operacionais e financeiros.
x-tagGroups:
- name: Área pública
  tags:
  - Autenticação
- name: Gestão operacional
  tags:
  - Utilizadores
  - Animais
  - Reservas
  - Serviços
  - Pagamentos
- name: Direção
  tags:
  - Relatórios
security:
- bearerAuth: []
paths:
  /api/auth/registar:
    post:
      tags:
      - Autenticação
      summary: Registar conta de proprietário
      operationId: registarProprietario
      description: Cria uma nova conta de proprietário e devolve os dados públicos do utilizador criado.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistarUtilizadorRequest'
      responses:
        '201':
          description: Conta criada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilizadorResponse'
        '400':
          description: Pedido inválido ou regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
  /api/auth/login:
    post:
      tags:
      - Autenticação
      summary: Autenticar utilizador
      operationId: login
      description: Valida as credenciais e devolve um JWT para utilização nos endpoints protegidos.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticação realizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Pedido inválido ou regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
  /api/utilizadores/funcionario:
    post:
      tags:
      - Utilizadores
      summary: Criar conta de funcionário
      operationId: criarFuncionario
      description: Cria uma conta interna. Apenas ADMIN. O parâmetro tipo não pode ser PROPRIETARIO.
      parameters:
      - name: tipo
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/TipoContaFuncionario'
        description: Tipo de conta interna a criar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistarUtilizadorRequest'
      responses:
        '201':
          description: Funcionário criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilizadorResponse'
        '400':
          description: Pedido inválido ou regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '401':
          description: Não autenticado. Token JWT ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '403':
          description: Acesso recusado. O utilizador autenticado não tem permissões suficientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
  /api/utilizadores:
    get:
      tags:
      - Utilizadores
      summary: Listar utilizadores
      operationId: listarUtilizadores
      description: Lista todos os utilizadores. Apenas ADMIN.
      responses:
        '200':
          description: Lista de utilizadores.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UtilizadorResponse'
        '401':
          description: Não autenticado. Token JWT ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '403':
          description: Acesso recusado. O utilizador autenticado não tem permissões suficientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
  /api/utilizadores/{id}:
    get:
      tags:
      - Utilizadores
      summary: Obter utilizador por ID
      operationId: obterUtilizador
      description: Consulta os dados públicos de um utilizador autenticado.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Identificador numérico do recurso.
      responses:
        '200':
          description: Utilizador encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilizadorResponse'
        '401':
          description: Não autenticado. Token JWT ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '404':
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
    put:
      tags:
      - Utilizadores
      summary: Editar perfil de utilizador
      operationId: editarPerfil
      description: Atualiza nome e telefone de um utilizador autenticado.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Identificador numérico do recurso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditarPerfilRequest'
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtilizadorResponse'
        '400':
          description: Pedido inválido ou regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '401':
          description: Não autenticado. Token JWT ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '404':
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
    delete:
      tags:
      - Utilizadores
      summary: Desativar conta de utilizador
      operationId: desativarConta
      description: Desativa uma conta por soft delete. Apenas ADMIN.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Identificador numérico do recurso.
      responses:
        '204':
          description: Conta desativada com sucesso.
        '401':
          description: Não autenticado. Token JWT ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '403':
          description: Acesso recusado. O utilizador autenticado não tem permissões suficientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '404':
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
  /api/animais/proprietario/{proprietarioId}:
    post:
      tags:
      - Animais
      summary: Criar ficha de animal
      operationId: criarAnimal
      description: Cria uma ficha de animal associada a um proprietário.
      parameters:
      - name: proprietarioId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Identificador do proprietário.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimalRequest'
      responses:
        '201':
          description: Animal criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalResponse'
        '400':
          description: Pedido inválido ou regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '401':
          description: Não autenticado. Token JWT ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '403':
          description: Acesso recusado. O utilizador autenticado não tem permissões suficientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '404':
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
    get:
      tags:
      - Animais
      summary: Listar animais por proprietário
      operationId: listarAnimaisPorProprietario
      description: Lista os animais associados a um proprietário.
      parameters:
      - name: proprietarioId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Identificador do proprietário.
      responses:
        '200':
          description: Lista de animais do proprietário.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnimalResponse'
        '401':
          description: Não autenticado. Token JWT ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '404':
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
  /api/animais/{id}:
    get:
      tags:
      - Animais
      summary: Obter animal por ID
      operationId: obterAnimal
      description: Consulta a ficha de um animal.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Identificador numérico do recurso.
      responses:
        '200':
          description: Animal encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalResponse'
        '401':
          description: Não autenticado. Token JWT ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '404':
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
    put:
      tags:
      - Animais
      summary: Editar ficha de animal
      operationId: editarAnimal
      description: Atualiza a ficha de um animal.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Identificador numérico do recurso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimalRequest'
      responses:
        '200':
          description: Animal atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalResponse'
        '400':
          description: Pedido inválido ou regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '401':
          description: Não autenticado. Token JWT ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '403':
          description: Acesso recusado. O utilizador autenticado não tem permissões suficientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '404':
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
    delete:
      tags:
      - Animais
      summary: Eliminar animal
      operationId: eliminarAnimal
      description: Remove a ficha de um animal. Apenas FUNC_ADMINISTRATIVO ou ADMIN.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Identificador numérico do recurso.
      responses:
        '204':
          description: Animal eliminado com sucesso.
        '401':
          description: Não autenticado. Token JWT ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '403':
          description: Acesso recusado. O utilizador autenticado não tem permissões suficientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '404':
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
  /api/animais:
    get:
      tags:
      - Animais
      summary: Listar todos os animais
      operationId: listarAnimais
      description: Lista todos os animais para perfis internos autorizados.
      responses:
        '200':
          description: Lista de animais.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnimalResponse'
        '401':
          description: Não autenticado. Token JWT ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '403':
          description: Acesso recusado. O utilizador autenticado não tem permissões suficientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
  /api/reservas/disponibilidade:
    get:
      tags:
      - Reservas
      summary: Verificar disponibilidade
      operationId: verificarDisponibilidade
      description: Consulta disponibilidade de espaços para uma espécie, porte e intervalo de datas. Público.
      security: []
      parameters:
      - name: especie
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Especie'
        description: Espécie do animal.
      - name: porte
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Porte'
        description: Porte do animal.
      - name: dataInicio
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Data de entrada.
      - name: dataFim
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Data de saída.
      responses:
        '200':
          description: Disponibilidade calculada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibilidadeResponse'
        '400':
          description: Pedido inválido ou regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
  /api/reservas:
    post:
      tags:
      - Reservas
      summary: Criar reserva
      operationId: criarReserva
      description: Cria uma reserva para um animal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarReservaRequest'
      responses:
        '201':
          description: Reserva criada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          description: Pedido inválido ou regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '401':
          description: Não autenticado. Token JWT ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '403':
          description: Acesso recusado. O utilizador autenticado não tem permissões suficientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '404':
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
    get:
      tags:
      - Reservas
      summary: Listar todas as reservas
      operationId: listarReservas
      description: Lista todas as reservas para perfis internos autorizados.
      responses:
        '200':
          description: Lista de reservas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservaResponse'
        '401':
          description: Não autenticado. Token JWT ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '403':
          description: Acesso recusado. O utilizador autenticado não tem permissões suficientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
  /api/reservas/{id}:
    get:
      tags:
      - Reservas
      summary: Obter reserva por ID
      operationId: obterReserva
      description: Consulta os detalhes de uma reserva.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Identificador numérico do recurso.
      responses:
        '200':
          description: Reserva encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '401':
          description: Não autenticado. Token JWT ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '404':
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
  /api/reservas/proprietario/{proprietarioId}:
    get:
      tags:
      - Reservas
      summary: Listar reservas por proprietário
      operationId: listarReservasPorProprietario
      description: Lista reservas associadas a um proprietário.
      parameters:
      - name: proprietarioId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Identificador do proprietário.
      responses:
        '200':
          description: Lista de reservas do proprietário.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservaResponse'
        '401':
          description: Não autenticado. Token JWT ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '404':
          description: Recurso não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
  /api/reservas/ativas:
    get:
      tags:
      - Reservas
      summary: Listar estadias ativas
      operationId: listarEstadiasAtivas
      description: Lista as estadias ativas numa data. Se a data for omitida, usa a data atual do servidor.
      parameters:
      - name: data
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Data de referência.
      responses:
        '200':
          description: Lista de estadias ativas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservaResponse'
        '401':
          description: Não autenticado. Token JWT ausente, inválido ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '403':
          description: Acesso recusado. O utilizador autenticado não tem permissões suficientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '500':
          description: Erro interno inesperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
  /api/reservas/{id}/confirmar:
    patch:
      tags:
      - Reservas
      summary: Confirmar reserva
      operationId: confirmarReserva
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Identificador da reserva.
      responses:
        '200':
          description: Reserva atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaResponse'
        '400':
          description: Pedido inválido ou regra de negócio violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
        '401':
