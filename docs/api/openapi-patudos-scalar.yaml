components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Usar o token devolvido por POST /api/auth/login no formato: Bearer <token>.'
  schemas:
    TipoConta:
      type: string
      enum:
      - PROPRIETARIO
      - FUNC_ADMINISTRATIVO
      - FUNC_OPERACIONAL
      - DIRECAO
      - ADMIN
    TipoContaFuncionario:
      type: string
      enum:
      - FUNC_ADMINISTRATIVO
      - FUNC_OPERACIONAL
      - DIRECAO
      - ADMIN
    Especie:
      type: string
      enum:
      - CAO
      - GATO
    Porte:
      type: string
      enum:
      - PEQUENO_MEDIO
      - GRANDE
      - NAO_APLICAVEL
    EstadoReserva:
      type: string
      enum:
      - PENDENTE
      - CONFIRMADA
      - EM_ESTADIA
      - CONCLUIDA
      - CANCELADA
    RegistarUtilizadorRequest:
      type: object
      required:
      - email
      - nome
      - telefone
      - password
      properties:
        email:
          type: string
          format: email
          example: rui@example.com
        nome:
          type: string
          example: Rui Abreu
        telefone:
          type: string
          example: '912345678'
        password:
          type: string
          format: password
          example: password123
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          example: rui@example.com
        password:
          type: string
          format: password
          example: password123
    EditarPerfilRequest:
      type: object
      required:
      - nome
      - telefone
      properties:
        nome:
          type: string
          example: Rui Abreu
        telefone:
          type: string
          example: '912345678'
    UtilizadorResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: rui@example.com
        nome:
          type: string
          example: Rui Abreu
        telefone:
          type: string
          example: '912345678'
        tipoConta:
          $ref: '#/components/schemas/TipoConta'
        ativo:
          type: boolean
          example: true
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9...
        utilizador:
          $ref: '#/components/schemas/UtilizadorResponse'
    AnimalRequest:
      type: object
      required:
      - nome
      - especie
      - porte
      properties:
        nome:
          type: string
          example: Tobias
        especie:
          $ref: '#/components/schemas/Especie'
        porte:
          $ref: '#/components/schemas/Porte'
        raca:
          type: string
          example: Labrador
        dataNascimento:
          type: string
          format: date
          example: '2020-05-12'
        observacoes:
          type: string
          example: Animal sociável, necessita de alimentação específica.
    AnimalResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        nome:
          type: string
          example: Tobias
        especie:
          $ref: '#/components/schemas/Especie'
        porte:
          $ref: '#/components/schemas/Porte'
        raca:
          type: string
          example: Labrador
        dataNascimento:
          type: string
          format: date
          example: '2020-05-12'
        observacoes:
          type: string
          example: Animal sociável.
        proprietarioId:
          type: integer
          format: int64
          example: 1
        proprietarioNome:
          type: string
          example: Rui Abreu
    CriarReservaRequest:
      type: object
      required:
      - animalId
      - dataInicio
      - dataFim
      properties:
        animalId:
          type: integer
          format: int64
          example: 10
        dataInicio:
          type: string
          format: date
          example: '2026-06-01'
        dataFim:
          type: string
          format: date
          example: '2026-06-05'
    ReservaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 100
        animalId:
          type: integer
          format: int64
          example: 10
        animalNome:
          type: string
          example: Tobias
        proprietarioNome:
          type: string
          example: Rui Abreu
        codigoEspaco:
          type: string
          nullable: true
          example: CA1
          description: Nulo até ao momento do check-in.
        dataInicio:
          type: string
          format: date
          example: '2026-06-01'
        dataFim:
          type: string
          format: date
          example: '2026-06-05'
        estado:
          $ref: '#/components/schemas/EstadoReserva'
        instanteCheckIn:
          type: string
          format: date-time
          nullable: true
          example: '2026-06-01T10:30:00'
        instanteCheckOut:
          type: string
          format: date-time
          nullable: true
          example: '2026-06-05T12:00:00'
        precoBase:
          type: number
          format: double
          example: 80.0
        totalComServicos:
          type: number
          format: double
          example: 110.0
    DisponibilidadeResponse:
      type: object
      properties:
        disponivel:
          type: boolean
          example: true
        espacosLivres:
          type: integer
          example: 3
        precoEstimado:
          type: number
          format: double
          example: 80.0
    ServicoRequest:
      type: object
      required:
      - nome
      - preco
      - capacidadeDiaria
      properties:
        nome:
          type: string
          example: Banho
        descricao:
          type: string
          example: Banho completo durante a estadia.
        preco:
          type: number
          format: double
          example: 20.0
        capacidadeDiaria:
          type: integer
          example: 5
    ServicoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 5
        nome:
          type: string
          example: Banho
        descricao:
          type: string
          example: Banho completo durante a estadia.
        preco:
          type: number
          format: double
          example: 20.0
        capacidadeDiaria:
          type: integer
          example: 5
        disponivel:
          type: boolean
          example: true
    AssociarServicoRequest:
      type: object
      required:
      - servicoId
      - dataExecucao
      properties:
        servicoId:
          type: integer
          format: int64
          example: 5
        dataExecucao:
          type: string
          format: date
          example: '2026-06-03'
    PagamentoRequest:
      type: object
      required:
      - valor
      - metodoPagamento
      properties:
        valor:
          type: number
          format: double
          example: 110.0
        metodoPagamento:
          type: string
          example: MBWAY
    PagamentoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 77
        reservaId:
          type: integer
          format: int64
          example: 100
        valor:
          type: number
          format: double
          example: 110.0
        metodoPagamento:
          type: string
          example: MBWAY
        instantePagamento:
          type: string
          format: date-time
          example: '2026-06-01T11:00:00'
        caminhoFatura:
          type: string
          nullable: true
          example: /faturas/fatura-77.pdf
    ResumoFinanceiroResponse:
      type: object
      properties:
        reservaId:
          type: integer
          format: int64
          example: 100
        totalReserva:
          type: number
          format: double
          example: 110.0
        totalPago:
          type: number
          format: double
          example: 50.0
        saldoPendente:
          type: number
          format: double
          example: 60.0
    RelatorioOcupacaoResponse:
      type: object
      properties:
        inicio:
          type: string
          format: date
          example: '2026-06-01'
        fim:
          type: string
          format: date
          example: '2026-06-30'
        totalEspacos:
          type: integer
          example: 48
        taxaMediaOcupacao:
          type: number
          format: double
          example: 72.5
        ocupacaoPorDia:
          type: object
          additionalProperties:
            type: integer
          example:
            '2026-06-01': 20
            '2026-06-02': 22
    RelatorioReceitasResponse:
      type: object
      properties:
        inicio:
          type: string
          format: date
          example: '2026-01-01'
        fim:
          type: string
          format: date
          example: '2026-12-31'
        totalReceitas:
          type: number
          format: double
          example: 3200.0
        receitasPorMes:
          type: object
          additionalProperties:
            type: number
            format: double
          example:
            2026-06: 1200.0
            2026-07: 2000.0
    ItemServicoResponse:
      type: object
      properties:
        nomeServico:
          type: string
          example: Banho
        totalRequisicoes:
          type: integer
          format: int64
          example: 25
    RelatorioServicosResponse:
      type: object
      properties:
        inicio:
          type: string
          format: date
        fim:
          type: string
          format: date
        servicosMaisRequisitados:
          type: array
          items:
            $ref: '#/components/schemas/ItemServicoResponse'
    ErroResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        erro:
          type: string
          example: Bad Request
        mensagem:
          type: string
          example: Datas inválidas.
